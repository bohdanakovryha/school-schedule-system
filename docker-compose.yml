services:
  mysql:
    image: mysql:8.0
    container_name: mysql-school
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: school_schedule
      MYSQL_USER: schooladmin
      MYSQL_PASSWORD: schoolpassword
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - school-network
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      interval: 10s
      timeout: 5s
      retries: 10

  schoolschedule:
    build: .
    container_name: school-schedule-app
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-school:3306/school_schedule
      SPRING_DATASOURCE_USERNAME: schooladmin
      SPRING_DATASOURCE_PASSWORD: schoolpassword
    networks:
      - school-network
    extra_hosts:
      - "host.docker.internal:host-gateway"

volumes:
  mysql-data:

networks:
  school-network:
    driver: bridge
