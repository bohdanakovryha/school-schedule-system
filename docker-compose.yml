version: '3'
services:
  schoolSchedule:
    image: your-image-name
    ports:
      - "8080:8080"
    volumes:
      - h2-data:/data/db
    environment:
      - SPRING_DATASOURCE_URL=jdbc:h2:/data/db/testdb;DB_CLOSE_DELAY=-1;AUTO_SERVER=TRUE
    restart: always
    networks:
      - school-network
volumes:
  h2-data:
    driver: local
networks:
  school-network:
    driver: bridge
