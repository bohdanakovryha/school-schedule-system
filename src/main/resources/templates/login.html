<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login</title>

    <style>
        body {
            display: flex;
            margin: 0;
            height: 100vh;
            font-family: Arial, sans-serif;
        }

        /* SIDEBAR */
        .sidebar {
            width: 290px;
            background-color: #241446;
            padding: 20px;
            height: 100vh;
            box-sizing: border-box;

            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .sidebar h2 {
            color: white;
            font-size: 28px;
        }

        /* CONTENT */
        .content {
            flex-grow: 1;
            background-color: #8479b9;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* LOGIN CARD */
        .login-box {
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.2);
            width: 380px;
        }

        .login-box h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #241446;
        }

        .form-group {
            margin-bottom: 15px;
            width: 350px;
        }

        label {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }

        input {
            width: 100%;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ccc;
            box-sizing: border-box;
        }

        input:focus {
            outline: none;
            border-color: #6402ff;
            box-shadow: 0 0 5px rgba(100, 2, 255, 0.5);
        }

        .login-btn {
            width: 350px;
            padding: 10px;
            background-color: #6402ff;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
            margin-top: 10px;
        }

        .login-btn:hover {
            background-color: rgba(100, 2, 255, 0.8);
        }

        .error, .logout {
            color: #6402ff; /* 🔥 фіолетовий */
            text-align: center;
            margin-top: 10px;
            font-weight: 500;
        }

        .login-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .logo {
            width: 190px;
            height: auto;

            display: block;
            margin: 10px auto 25px auto;

            border-radius: 15px;
            border: 3px solid white;

            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
        }
    </style>
    <link rel="icon" type="image/png" href="/images/favicon.png">
</head>

<body>

<div class="sidebar">
    <img src="/images/logo.png" alt="Schedify Logo" class="logo"/>
</div>

<div class="content">

    <div class="login-box">
        <h2>Login</h2>

        <form th:action="@{/login}" method="post">

            <input type="hidden"
                   th:name="${_csrf.parameterName}"
                   th:value="${_csrf.token}" />

            <div class="form-group">
                <label>Username:</label>
                <input type="text" name="username"/>
            </div>

            <div class="form-group">
                <label>Password:</label>
                <input type="password" name="password"/>
            </div>

            <button type="submit" class="login-btn">Login</button>
        </form>

        <div th:if="${param.error}" class="error">
            Invalid username or password
        </div>

        <div th:if="${param.logout}" class="logout">
            You logged out
        </div>
    </div>

</div>

</body>
</html>
