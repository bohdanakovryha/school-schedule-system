<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Розклад</title>
  <style>
    body {
      display: flex;
      flex-direction: row;
      margin: 0;
      height: 100vh;
    }

    .sidebar {
      width: 290px;
      background-color: #241446;
      padding: 10px;
      position: fixed;
      height: 100vh;
      top: 0;
      left: 0;
      box-sizing: border-box;
    }

    .content {
      margin-left: 290px;
      flex-grow: 1;
      height: 100vh;
      overflow: hidden;
      box-sizing: border-box;

      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px;
    }

    .sidebar ul {
      list-style-type: none;
      padding: 0;
    }
    .sidebar li {
      padding: 10px;
    }

    .sidebar a {
      text-decoration: none;
      color: white;
      font-size: 32px;
      font-weight: bold;
      display: block;
      padding: 10px;
      border-radius: 5px;
    }

    .sidebar a:hover {
      background-color: rgba(255, 255, 255, 0.2);
      padding-left: 10px;
    }

    .collapse {
      display: none;
      padding-left: 10px;
    }

    .collapse.show {
      display: block;
    }

    .collapse-item {
      color: white;
      font-size: 15px;
      padding: 5px;
      display: block;
      text-decoration: none;
      font-weight: normal;
      background-color: rgba(100, 2, 255, 0.2);
      border-radius: 5px;
    }

    .collapse-item:hover {
      background-color: rgba(100, 2, 255, 0.4);
    }

    .nav-link {
      cursor: pointer;
      display: flex;
      align-items: center;
      font-size: 15px;
    }

    .nav-link i {
      display: flex;
      align-items: center;
    }

    .bg-white {
      background-color: #8479b9;
      padding: 5px;
      border-radius: 5px;
    }

    .rounded {
      border-radius: 5px;
    }

    #w7-collapse2 {
      margin-top: 20px;
      margin-bottom: auto;
    }
    #w7-collapse2 .collapse-item {
      font-size: 25px;
    }

    select {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      margin-top: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
      background-color: #fff;
    }

    option {
      font-size: 16px;
      padding: 10px;
    }

    #classDropdown option, #teacherDropdown option {
      background-color: #f4f4f4;
    }

    #classDropdown option:hover, #teacherDropdown option:hover {
      background-color: #ddd;
    }

    #classSelect h3, #teacherSelect h3 {
      font-size: 18px;
      margin-bottom: 10px;
    }

    .logout-btn {
      width: 100%;
      padding: 10px;
      font-size: 18px;
      font-weight: bold;
      color: white;
      background-color: #6402ff;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }

    .logout-btn:hover {
      background-color: rgba(100, 2, 255, 0.8);
    }

    .logo {
      width: 160px;
      height: auto;

      display: block;
      margin: 10px auto 25px auto;

      border-radius: 15px;
      border: 3px solid white;

      box-shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    .main-image {
      max-width: 70%;
      max-height: 80%;
      object-fit: contain;
    }
  </style>
  <link rel="icon" type="image/png" href="/static/images/favicon.png">
</head>
<body>
<div class="sidebar">

  <img src="/images/logo.png" alt="Schedify Logo" class="logo"/>

  <ul>
    <li>
      <a href="/adminPanel" style="font-size: 30px;">Адміністративна<br>панель</a>
    </li>
    <li><a href="#">Головна</a></li>
    <li>
      <a class="nav-link" href="#" data-toggle="collapse" data-target="#w7-collapse2" aria-expanded="false" aria-controls="w7-collapse2">
        <i class="fas fa-fw fa-calendar"></i><span>Розклад</span>
      </a>
      <div id="w7-collapse2" class="collapse" aria-labelledby="headingPages" data-parent="#accordionSidebar">
        <div class="bg-white py-2 collapse-inner rounded">
          <a class="collapse-item" href="/classes">Для студента</a>
          <a class="collapse-item" href="/teachers">Для викладача</a>
        </div>
      </div>
    </li>
    <form th:action="@{/logout}" method="post" style="margin-top: 20px;">
      <input type="hidden"
             th:name="${_csrf.parameterName}"
             th:value="${_csrf.token}" />

      <button type="submit" class="logout-btn">Logout</button>
    </form>
  </ul>
</div>
<div class="content" style="display: flex; justify-content: center; align-items: center; height: 100vh;">
  <img src="/images/main.png" alt="Головне зображення" class="main-image">
</div>
<script>
  document.addEventListener("DOMContentLoaded", function() {
    const navLink = document.querySelector('.nav-link');
    const collapseMenu = document.getElementById('w7-collapse2');

    if (navLink) {
      navLink.addEventListener('click', function(event) {
        event.preventDefault();
        collapseMenu.classList.toggle('show');
      });
    }
  });
</script>
</body>
</html>
