<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Розклад</title>
  <style>
    body {
      display: flex;
      flex-direction: row;
      margin: 0;
      height: 100vh;
    }

    .sidebar {
      width: 200px;
      background-color: #6402ff;
      padding: 10px;
      position: fixed;
      height: 100vh;
      top: 0;
      left: 0;
      box-sizing: border-box;
    }

    .content {
      margin-left: 200px;
      flex-grow: 1;
      padding: 20px;
      height: 100%;
      overflow-y: auto;
    }

    .sidebar ul {
      list-style-type: none;
      padding: 0;
    }
    .sidebar li {
      padding: 10px;
    }

    .sidebar a {
      text-decoration: none;
      color: white;
      font-size: 32px;
      font-weight: bold;
      display: block;
      padding: 10px;
      border-radius: 5px;
    }

    .sidebar a:hover {
      background-color: rgba(255, 255, 255, 0.2);
      padding-left: 10px;
    }

    .collapse {
      display: none;
      padding-left: 10px;
    }

    .collapse.show {
      display: block;
    }

    .collapse-item {
      color: white;
      font-size: 15px;
      padding: 5px;
      display: block;
      text-decoration: none;
      font-weight: normal;
      background-color: rgba(100, 2, 255, 0.2);
      border-radius: 5px;
    }

    .collapse-item:hover {
      background-color: rgba(100, 2, 255, 0.4);
    }

    .nav-link {
      cursor: pointer;
      display: flex;
      align-items: center;
      font-size: 15px;
    }

    .nav-link i {
      display: flex;
      align-items: center;
    }

    .bg-white {
      background-color: #8479b9;
      padding: 5px;
      border-radius: 5px;
    }

    .rounded {
      border-radius: 5px;
    }

    #w7-collapse2 {
      margin-top: 20px;
      margin-bottom: auto;
    }
    #w7-collapse2 .collapse-item {
      font-size: 25px;
    }

    /* Сховати блоки по замовчуванню */
    #roleSelect, #classSelect, #teacherSelect {
      display: none;
    }

    /* Стилі для тексту "Тут буде Ваш розклад" */
    #defaultText {
      font-size: 24px;
      text-align: center;
      margin-top: 50px;
    }

    #classSelect, #teacherSelect {
      margin-top: 20px;
    }
    select {
      width: 100%;
      padding: 10px;
      font-size: 16px;
      margin-top: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
      background-color: #fff;
    }

    /* Стилі для option */
    option {
      font-size: 16px;
      padding: 10px;
    }

    /* Стилі для кнопки вибору класу та викладача */
    #classDropdown, #teacherDropdown {
      margin-top: 20px;
    }

    /* Додаткові стилі для "Оберіть клас" та "Оберіть викладача" */
    #classDropdown option, #teacherDropdown option {
      background-color: #f4f4f4;
    }

    /* При наведенні курсора на елемент */
    #classDropdown option:hover, #teacherDropdown option:hover {
      background-color: #ddd;
    }

    /* Стилі для контейнера для вибору класу та викладача */
    #classSelect, #teacherSelect {
      margin-top: 20px;
      padding: 10px;
      background-color: #6402ff;
      border-radius: 5px;
      color: white;
    }

    /* Стилі для заголовку */
    #classSelect h3, #teacherSelect h3 {
      font-size: 18px;
      margin-bottom: 10px;
    }

    /* Загальний стиль для всіх елементів select */
    #classDropdown, #teacherDropdown {
      font-size: 16px;
      padding: 8px;
      background-color: #f4f4f4;
      border-radius: 5px;
    }

    /* Стилизація для активних елементів */
    #classDropdown:focus, #teacherDropdown:focus {
      border-color: #6402ff;
      outline: none;
    }
  </style>
</head>
<body>
<div class="sidebar">
  <ul>
    <li><a href="http://example.com">Головна</a></li>
    <li>
      <a class="nav-link" href="#" data-toggle="collapse" data-target="#w7-collapse2" aria-expanded="false" aria-controls="w7-collapse2">
        <i class="fas fa-fw fa-calendar"></i><span>Розклад</span>
      </a>
      <div id="w7-collapse2" class="collapse" aria-labelledby="headingPages" data-parent="#accordionSidebar">
        <div class="bg-white py-2 collapse-inner rounded">
          <a class="collapse-item" href="javascript:void(0)" onclick="showRoleContent('student')">Для студента</a>
          <a class="collapse-item" href="javascript:void(0)" onclick="showRoleContent('teacher')">Для викладача</a>
        </div>
      </div>
    </li>
  </ul>
</div>

<div class="content">
  <h1>Розклад</h1>
  <div id="defaultText">Тут буде Ваш розклад</div>

  <!-- Вибір ролі (студент або викладач) -->
  <div id="roleSelect">
    <h3>Оберіть роль:</h3>
    <select id="userRole" onchange="showRoleContent()">
      <option value="">Оберіть роль</option>
      <option value="student">Для Студента</option>
      <option value="teacher">Для Викладача</option>
    </select>
  </div>

  <!-- Вибір класу для студента -->
  <div id="classSelect">
    <h3>Оберіть Ваш клас:</h3>
    <select id="classDropdown">
      <option value="">Оберіть клас</option>
      <option value="1">1 клас</option>
      <option value="2">2 клас</option>
      <option value="3">3 клас</option>
      <option value="4">4 клас</option>
      <option value="5">5 клас</option>
      <option value="6">6 клас</option>
      <option value="7">7 клас</option>
      <option value="8">8 клас</option>
      <option value="9">9 клас</option>
      <option value="10">10 клас</option>
      <option value="11">11 клас</option>
      <option value="12">12 клас</option>
      <option value="13">Індивідуальне</option>
    </select>
  </div>

  <!-- Вибір викладача для викладача -->
  <div id="teacherSelect">
    <h3>Оберіть викладача:</h3>
    <select id="teacherDropdown">
      <option value="">Оберіть викладача</option>
      <option value="1">Коврига Леся Вікторівна</option>
      <option value="2">Шевченко Тетяна Михайлівна</option>
      <option value="3">Власенко Людмила Дмитрівна</option>
      <option value="4">Гуленко Сергій Володимирович</option>
      <option value="5">Гуленко Володимир Сергійович</option>
      <option value="6">Олефіренко Ірина Леонідівна</option>
      <option value="7">Куцекінь Володимир Миколайович</option>
      <option value="8">Гелевера Анатолій Андрійович</option>
      <option value="9">Гуленко Лідія Григорівна</option>
      <option value="10">Власенко Світлана Сергіївна</option>
      <option value="11">Тесленко Людмила Миколаївна</option>
      <option value="12">Коврига Олександр Миколайович</option>
      <option value="13">Демидюк Сергій Володимирович</option>
    </select>
  </div>
</div>

<script>
  // Показати відповідний блок (клас для студента або викладача)
  function showRoleContent(role) {
    // Сховати всі блоки
    document.getElementById("classSelect").style.display = "none";
    document.getElementById("teacherSelect").style.display = "none";
    document.getElementById("defaultText").style.display = "none";

    // Показати вибраний блок
    if (role === "student") {
      document.getElementById("classSelect").style.display = "block";
    } else if (role === "teacher") {
      document.getElementById("teacherSelect").style.display = "block";
    }
  }

  // Завантажити класи (якщо сервер не відповідає)
  function loadClasses() {
    fetch('/api/classes')
            .then(response => response.json())
            .then(classes => {
              const classDropdown = document.getElementById("classDropdown");
              classDropdown.innerHTML = "<option value=''>Оберіть клас</option>"; // Очистити попередні опції
              if (classes.length > 0) {
                classes.forEach(cls => {
                  const option = document.createElement("option");
                  option.value = cls.id;
                  option.text = cls.name;
                  classDropdown.appendChild(option);
                });
              } else {
                // Якщо API не повертає дані, додаємо стандартні варіанти
                const defaultClasses = [
                  {id: '1', name: '1 клас'},
                  {id: '2', name: '2 клас'},
                  {id: '3', name: '3 клас'},
                  {id: '4', name: '4 клас'},
                  {id: '5', name: '5 клас'},
                  {id: '6', name: '6 клас'},
                  {id: '7', name: '7 клас'},
                  {id: '8', name: '8 клас'},
                  {id: '9', name: '9 клас'},
                  {id: '10', name: '10 клас'},
                  {id: '11', name: '11 клас'},
                  {id: '12', name: '12 клас'},
                  {id: '13', name: 'Індивідуальне'}
                ];
                defaultClasses.forEach(cls => {
                  const option = document.createElement("option");
                  option.value = cls.id;
                  option.text = cls.name;
                  classDropdown.appendChild(option);
                });
              }
            })
            .catch(error => console.error('Error loading classes:', error));
  }

  // Завантажити викладачів (якщо сервер не відповідає)
  function loadTeachers() {
    fetch('/api/teachers')
            .then(response => response.json())
            .then(teachers => {
              const teacherDropdown = document.getElementById("teacherDropdown");
              teacherDropdown.innerHTML = "<option value=''>Оберіть викладача</option>"; // Очистити попередні опції
              if (teachers.length > 0) {
                teachers.forEach(teacher => {
                  const option = document.createElement("option");
                  option.value = teacher.id;
                  option.text = teacher.name;
                  teacherDropdown.appendChild(option);
                });
              } else {
                // Якщо API не повертає дані, додаємо стандартних викладачів
                const defaultTeachers = [
                  {id: '1', name: 'Коврига Леся Вікторівна'},
                  {id: '2', name: 'Шевченко Тетяна Михайлівна'},
                  {id: '3', name: 'Власенко Людмила Дмитрівна'},
                  {id: '4', name: 'Гуленко Сергій Володимирович'},
                  {id: '5', name: 'Гуленко Володимир Сергійович'},
                  {id: '6', name: 'Олефіренко Ірина Леонідівна'},
                  {id: '7', name: 'Куцекінь Володимир Миколайович'},
                  {id: '8', name: 'Гелевера Анатолій Андрійович'},
                  {id: '9', name: 'Гуленко Лідія Григорівна'},
                  {id: '10', name: 'Власенко Світлана Сергіївна'},
                  {id: '11', name: 'Тесленко Людмила Миколаївна'},
                  {id: '12', name: 'Коврига Олександр Миколайович'},
                  {id: '13', name: 'Демидюк Сергій Володимирович'}
                ];
                defaultTeachers.forEach(teacher => {
                  const option = document.createElement("option");
                  option.value = teacher.id;
                  option.text = teacher.name;
                  teacherDropdown.appendChild(option);
                });
              }
            })
            .catch(error => console.error('Error loading teachers:', error));
  }

  document.addEventListener("DOMContentLoaded", function() {
    const navLink = document.querySelector('.nav-link');
    const collapseMenu = document.getElementById('w7-collapse2');

    if (navLink) {
      navLink.addEventListener('click', function(event) {
        event.preventDefault();
        collapseMenu.classList.toggle('show');
      });
    }
  });
</script>
</body>
</html>
